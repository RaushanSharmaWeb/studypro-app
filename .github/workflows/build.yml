name: Build StudyPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android Scaffold and Restore Main Code
        run: |
          # 1. Pehle apni asli lib/main.dart ko safe jagah backup lo
          mkdir -p /tmp/backup_code
          cp lib/main.dart /tmp/backup_code/main.dart

          # 2. Project recreate karo taaki android/ios folders ban jayein
          rm -rf pubspec.yaml pubspec.lock lib
          flutter create --org com.studywithpro.app --project-name study_with_pro .

          # 3. Apni asli lib/main.dart file ko wapas apni jagah restore karo
          mkdir -p lib
          cp /tmp/backup_code/main.dart lib/main.dart

          # 4. Zaroori dependencies add karo
          flutter pub add http shared_preferences video_player youtube_explode_dart

          # 5. Android Internet Permission add karo
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
