name: Build StudyPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files & Keep Custom Code
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.studywithpro.app --project-name study_with_pro .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
